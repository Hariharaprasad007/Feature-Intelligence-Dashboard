<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Product Pulse | Lifecycle Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'csm-strategic-pulse';
        const apiKey = ""; 

        const MODULE_LIST = [
            "Category Management", "Payment", "Search", "Site Performance", "API", "UI/UX", "Editor", "Security", 
            "Infrastructure", "Content Tools", "Analytics", "Integrations & Extensions", "Settings", 
            "API Documentation", "KB Site", "Drive", "Export to PDF", "Article Redirection", "Article Discussions", 
            "Article Review Reminders", "Article Revision History", "Article Settings", "Backup & Restore", 
            "Bulk Operations", "Content Security Policy", "Cookie Consent", "Custom Pages", "Extensions", 
            "Feedback Manager", "Find & Replace", "Glossary", "Snippets", "Health Check Metrics", "Import & Export", 
            "IP Restrictions", "KB Customization", "KB Site Article Settings", "Machine Translation", 
            "Notifications", "Readers & Groups", "Readers Self Registration", "Roles & Permissions", "SEO Description", 
            "Smart Bars & Announcements", "Tags & Groups", "Team Accounts & Groups", "Article Templates", 
            "Ticket Deflectors", "Variables", "Workflow Designer", "Workspace Manager", "KB Assistant", "Sandbox", 
            "AI - Eddy", "Dashboard", "AI Premium Suite", "AI Search Suite", "AI Writer Suite", "Article Management", 
            "Authentication & Authorization", "Billing", "Content reuse", "Dashboard & Analytics", 
            "Data Transfer & Recovery", "Editor - Advanced WYSIWYG", "Editor - Markdown", "Feedback Management", 
            "Widget, Chat, Ticket Deflector", "PDF export", "Interactive decision trees", "Project/workspace management", 
            "Read Receipt", "Team auditing/ Notification", "Team Collaboration", "Users and Security", 
            "Step-by-step guides", "MCP"
        ].sort();

        let user = null;
        let requests = [];
        let filteredRequests = [];
        let typeChart = null;
        let currentTab = 'requests';
        
        // Filters
        let filterText = "";
        let filterModule = "All";
        let filterPriority = "All";
        let showShipped = false;

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) setupDataListener();
        });

        function setupDataListener() {
            if (!user) return;
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'requests');
            onSnapshot(q, (snapshot) => {
                requests = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                applyFilters();
            }, (error) => console.error("Firestore error:", error));
        }

        async function callGemini(prompt, systemInstruction = "You are a Senior Product Strategist.") {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (error) {
                return "AI connection error.";
            }
        }

        function applyFilters() {
            filteredRequests = requests.filter(r => {
                const matchesText = r.customer.toLowerCase().includes(filterText.toLowerCase()) || 
                                    r.description.toLowerCase().includes(filterText.toLowerCase());
                const matchesModule = filterModule === 'All' || r.module === filterModule;
                const matchesPriority = filterPriority === 'All' || r.priority === filterPriority;
                
                // If showShipped is false, exclude 'Shipped' items. 
                // If true, show everything.
                const matchesStatus = showShipped || r.status !== 'Shipped';
                
                return matchesText && matchesModule && matchesPriority && matchesStatus;
            });
            renderDashboard();
        }

        window.handleFilterChange = () => {
            filterText = document.getElementById('searchFilter').value;
            filterModule = document.getElementById('moduleFilter').value;
            filterPriority = document.getElementById('priorityFilter').value;
            showShipped = document.getElementById('shippedFilter').checked;
            applyFilters();
        };

        window.updateStatus = async (id, newStatus) => {
            const reqDoc = doc(db, 'artifacts', appId, 'public', 'data', 'requests', id);
            await updateDoc(reqDoc, { status: newStatus });
        };

        window.exportCSV = () => {
            if (filteredRequests.length === 0) return;
            const headers = ["Date", "Customer", "MRR", "Description", "Module", "Priority", "Status", "Owner", "Canny"];
            const rows = filteredRequests.map(r => [
                new Date(r.timestamp).toLocaleDateString(),
                `"${r.customer}"`,
                r.mrr,
                `"${r.description.replace(/"/g, '""')}"`,
                r.module,
                r.priority,
                r.status,
                r.owner,
                r.canny || ""
            ]);
            
            let csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n" + rows.map(e => e.join(",")).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Strategic_Pulse_Export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        async function saveRequest(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> Saving...';

            const formData = new FormData(e.target);
            const data = {
                customer: formData.get('customer'),
                mrr: parseFloat(formData.get('mrr')) || 0,
                description: formData.get('description'),
                canny: formData.get('canny'),
                module: formData.get('module'),
                owner: formData.get('owner'),
                priority: formData.get('priority'),
                status: 'Logged',
                timestamp: Date.now()
            };

            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), data);
            e.target.reset();
            toggleForm();
            btn.disabled = false;
            btn.innerText = 'Submit Feature Request';
        }

        function renderDashboard() {
            const container = document.getElementById('mainContent');
            if (currentTab === 'requests') renderBacklog(container);
            else if (currentTab === 'quarterly') renderQuarterlyStrategy(container);
            else renderCallIntelligence(container);
            
            updateStats();
            updateChart();
        }

        function renderBacklog(container) {
            container.innerHTML = `
                <div class="flex flex-col gap-4">
                    <div class="flex flex-wrap gap-4 items-end bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                        <div class="flex-1 min-w-[200px]">
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Search</label>
                            <input id="searchFilter" oninput="handleFilterChange()" value="${filterText}" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" placeholder="Filter list...">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Module</label>
                            <select id="moduleFilter" onchange="handleFilterChange()" class="p-2.5 bg-slate-50 border rounded-xl text-xs min-w-[150px]">
                                <option value="All">All Modules</option>
                                ${MODULE_LIST.map(m => `<option value="${m}" ${filterModule === m ? 'selected' : ''}>${m}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Priority</label>
                            <select id="priorityFilter" onchange="handleFilterChange()" class="p-2.5 bg-slate-50 border rounded-xl text-xs">
                                <option value="All">All Priority</option>
                                <option ${filterPriority === 'Low' ? 'selected' : ''}>Low</option>
                                <option ${filterPriority === 'Medium' ? 'selected' : ''}>Medium</option>
                                <option ${filterPriority === 'High' ? 'selected' : ''}>High</option>
                                <option ${filterPriority === 'Critical' ? 'selected' : ''}>Critical</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-2 pb-2">
                            <input type="checkbox" id="shippedFilter" onchange="handleFilterChange()" ${showShipped ? 'checked' : ''} class="w-4 h-4 rounded accent-indigo-600">
                            <label for="shippedFilter" class="text-xs font-bold text-slate-600">Show Shipped</label>
                        </div>
                        <button onclick="exportCSV()" class="px-4 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold flex items-center gap-2 hover:bg-emerald-700 transition">
                            <i class="fas fa-file-csv"></i> Export
                        </button>
                    </div>

                    <div class="glass-card rounded-2xl shadow-sm overflow-hidden flex flex-col">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 text-slate-400 text-[10px] font-black uppercase tracking-widest border-b sticky top-0 z-10">
                                    <tr>
                                        <th class="p-4 bg-slate-50">Date</th>
                                        <th class="p-4 bg-slate-50">Customer</th>
                                        <th class="p-4 bg-slate-50">Impact</th>
                                        <th class="p-4 bg-slate-50">Status / Tracker</th>
                                        <th class="p-4 bg-slate-50">Module</th>
                                        <th class="p-4 bg-slate-50">Priority</th>
                                        <th class="p-4 bg-slate-50">Owner</th>
                                        <th class="p-4 bg-slate-50"></th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-xs">
                                    ${filteredRequests.length === 0 ? '<tr><td colspan="8" class="p-20 text-center text-slate-400 italic">No matching records found.</td></tr>' : 
                                    filteredRequests.sort((a,b) => b.timestamp - a.timestamp).map(req => `
                                        <tr class="hover:bg-indigo-50/30 transition-colors group ${req.status === 'Shipped' ? 'opacity-60 grayscale-[0.5]' : ''}">
                                            <td class="p-4 whitespace-nowrap text-slate-400 font-mono">${new Date(req.timestamp).toLocaleDateString()}</td>
                                            <td class="p-4">
                                                <div class="font-bold text-slate-800">${req.customer}</div>
                                                <div class="text-[10px] text-slate-400 truncate max-w-[150px]">${req.description}</div>
                                            </td>
                                            <td class="p-4 text-emerald-600 font-black">$${req.mrr.toLocaleString()}</td>
                                            <td class="p-4">
                                                <div class="flex items-center gap-2">
                                                    <select onchange="updateStatus('${req.id}', this.value)" class="bg-slate-100 border-none rounded-lg p-1 text-[10px] font-bold outline-none focus:ring-2 focus:ring-indigo-300">
                                                        <option value="Logged" ${req.status === 'Logged' ? 'selected' : ''}>Logged</option>
                                                        <option value="In Progress" ${req.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                                        <option value="Shipped" ${req.status === 'Shipped' ? 'selected' : ''}>Shipped ✅</option>
                                                    </select>
                                                    ${req.canny ? `<a href="${req.canny}" target="_blank" class="text-indigo-600 hover:scale-110 transition"><i class="fas fa-external-link-alt text-[10px]"></i></a>` : ''}
                                                </div>
                                            </td>
                                            <td class="p-4"><span class="bg-slate-100 px-2 py-1 rounded text-[10px]">${req.module}</span></td>
                                            <td class="p-4"><span class="px-2 py-1 rounded-full font-bold ${getPriorityClass(req.priority)}">${req.priority}</span></td>
                                            <td class="p-4 text-slate-500">${req.owner}</td>
                                            <td class="p-4 text-right">
                                                <button onclick="deleteReq('${req.id}')" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-opacity"><i class="fas fa-trash-alt"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
        }

        function updateStats() {
            // Stats should only reflect active (non-shipped) items
            const activeItems = requests.filter(r => r.status !== 'Shipped');
            document.getElementById('totalRequests').innerText = activeItems.length;
            const totalMRR = activeItems.reduce((sum, r) => sum + r.mrr, 0);
            document.getElementById('mrrImpact').innerText = `$${(totalMRR/1000).toFixed(1)}k`;
            document.getElementById('blockerCount').innerText = activeItems.filter(r => r.priority === 'Critical').length;
        }

        function updateChart() {
            const counts = {};
            // Chart also only shows active items
            requests.filter(r => r.status !== 'Shipped').forEach(r => counts[r.module] = (counts[r.module] || 0) + 1);
            if (typeChart) typeChart.destroy();
            const canvas = document.getElementById('typeChart');
            if (!canvas) return;
            const sortedEntries = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 10);
            typeChart = new Chart(canvas.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: sortedEntries.map(e => e[0]),
                    datasets: [{ label: 'Active Requests', data: sortedEntries.map(e => e[1]), backgroundColor: '#6366f1', borderRadius: 4 }]
                },
                options: { 
                    indexAxis: 'y', 
                    plugins: { legend: { display: false } }, 
                    maintainAspectRatio: false,
                    scales: { x: { display: false }, y: { grid: { display: false }, ticks: { font: { size: 9 } } } } 
                }
            });
        }

        function renderQuarterlyStrategy(container) {
            const activeItems = requests.filter(r => r.status !== 'Shipped');
            const modules = {};
            activeItems.forEach(r => {
                modules[r.module] = (modules[r.module] || 0) + (r.mrr * (r.priority === 'Critical' ? 3 : r.priority === 'High' ? 2 : 1));
            });
            const topModules = Object.entries(modules).sort((a,b) => b[1] - a[1]).slice(0, 3);

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-indigo-900 rounded-3xl p-10 text-white shadow-2xl relative overflow-hidden">
                        <div class="relative z-10">
                            <h2 class="text-3xl font-black mb-4">Strategic Focus (Active Only)</h2>
                            <p class="text-indigo-200 text-sm max-w-2xl mb-8 leading-relaxed">Excluding items already marked as Shipped. Based on revenue risk and priority weightings.</p>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                ${topModules.length === 0 ? '<div class="col-span-3 text-center py-10 opacity-50 italic">No active requests logged yet.</div>' : 
                                topModules.map(([name, score], i) => `
                                    <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                                        <div class="text-indigo-400 font-black text-5xl mb-4">0${i+1}</div>
                                        <div class="font-bold text-xl mb-1">${name}</div>
                                        <button onclick="generateStrategicPitch('${name}')" class="mt-4 w-full py-3 bg-white text-indigo-900 text-xs font-black rounded-xl uppercase">✨ AI Pitch</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderCallIntelligence(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="glass-card p-8 rounded-3xl">
                        <h3 class="font-black text-xl mb-4">Sync Analyzer</h3>
                        <textarea id="transcriptArea" class="w-full p-4 bg-slate-50 border-2 rounded-2xl text-sm h-48 outline-none focus:border-indigo-500" placeholder="Paste notes from PM sync..."></textarea>
                        <button onclick="analyzeTranscript()" class="w-full mt-4 py-4 bg-slate-900 text-white font-bold rounded-2xl transition hover:bg-black">✨ Extract Key Decisions</button>
                    </div>
                    <div id="decisionLog" class="space-y-4">
                        <h4 class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Decision Feed</h4>
                        <div class="p-4 bg-white border rounded-xl text-xs italic text-slate-400 text-center">Analyses will appear here after sync.</div>
                    </div>
                </div>`;
        }

        window.analyzeTranscript = async () => {
            const text = document.getElementById('transcriptArea').value;
            if (!text) return;
            const prompt = `Review this transcript and list PM decisions and CSM action items: ${text}`;
            const analysis = await callGemini(prompt);
            document.getElementById('decisionLog').innerHTML = `<div class="p-5 bg-indigo-50 border border-indigo-100 rounded-2xl text-xs leading-relaxed animate-in fade-in">${analysis.replace(/\n/g, '<br>')}</div>` + document.getElementById('decisionLog').innerHTML;
        };

        window.generateStrategicPitch = async (moduleName) => {
            const modal = document.getElementById('aiModal');
            modal.classList.replace('hidden', 'flex');
            const textEl = document.getElementById('summaryText');
            textEl.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-spinner animate-spin"></i> Preparing executive case for ${moduleName}...</div>`;
            const relevant = requests.filter(r => r.module === moduleName && r.status !== 'Shipped');
            const prompt = `Draft an executive business case for prioritizing ${moduleName}. Total MRR Impact: $${relevant.reduce((s,r)=>s+r.mrr,0)}. Details: ${relevant.map(r=>r.description).join('; ')}`;
            const pitch = await callGemini(prompt);
            textEl.innerHTML = `<div class="prose prose-sm text-slate-700 leading-relaxed">${pitch.replace(/\n/g, '<br>')}</div>`;
        };

        const getPriorityClass = (p) => {
            if (p === 'Critical') return 'bg-red-100 text-red-700';
            if (p === 'High') return 'bg-amber-100 text-amber-700';
            return 'bg-blue-100 text-blue-700';
        };

        window.toggleForm = () => document.getElementById('formDrawer').classList.toggle('translate-x-full');
        window.switchTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active', 'text-indigo-600', 'bg-white', 'shadow-md'));
            event.target.classList.add('tab-active', 'text-indigo-600', 'bg-white', 'shadow-md');
            renderDashboard();
        };
        window.deleteReq = async (id) => { if (confirm('Permanently delete this record?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'requests', id)); };

        window.onload = () => {
            initAuth();
            document.getElementById('requestForm').onsubmit = saveRequest;
        };
    </script>
    <style>
        .glass-card { background: white; border: 1px solid #f1f5f9; }
        .tab-active { color: #4f46e5; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fade-in 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 antialiased">

    <nav class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40 backdrop-blur-md bg-white/80">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-indigo-100">
                <i class="fas fa-chess-knight text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tight">Strategic<span class="text-indigo-600 italic">Pulse</span></h1>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Lifecycle Tracking Dashboard</p>
            </div>
        </div>
        <button onclick="toggleForm()" class="px-6 py-2.5 bg-slate-900 text-white text-xs font-black rounded-xl hover:shadow-2xl transition-all">
            <i class="fas fa-plus mr-2"></i>Log Request
        </button>
    </nav>

    <main class="max-w-full mx-auto p-8 space-y-10">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="glass-card p-6 rounded-3xl">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Active Requests</p>
                <h2 id="totalRequests" class="text-4xl font-black">0</h2>
            </div>
            <div class="glass-card p-6 rounded-3xl border-l-4 border-l-emerald-500">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Active MRR Risk</p>
                <h2 id="mrrImpact" class="text-4xl font-black text-emerald-600">$0k</h2>
            </div>
            <div class="glass-card p-6 rounded-3xl border-l-4 border-l-red-500">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Critical Blockers</p>
                <h2 id="blockerCount" class="text-4xl font-black text-red-600">0</h2>
            </div>
            <div class="glass-card p-6 rounded-3xl bg-indigo-600 text-white flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center"><i class="fas fa-check-circle"></i></div>
                <div>
                    <p class="text-[10px] font-black uppercase opacity-60">Insight Mode</p>
                    <p class="text-xs font-bold leading-tight">Excluding Shipped Items</p>
                </div>
            </div>
        </div>

        <div class="bg-slate-200/40 p-1.5 rounded-2xl flex gap-1 w-fit border border-slate-200">
            <button onclick="switchTab('requests')" class="tab-btn px-8 py-3 rounded-xl text-xs font-black transition-all bg-white shadow-md text-indigo-600">
                Backlog & Tracking
            </button>
            <button onclick="switchTab('quarterly')" class="tab-btn px-8 py-3 rounded-xl text-xs font-black transition-all text-slate-500 hover:bg-white/50">
                Roadmap Strategy
            </button>
            <button onclick="switchTab('calls')" class="tab-btn px-8 py-3 rounded-xl text-xs font-black transition-all text-slate-500 hover:bg-white/50">
                Call Intelligence
            </button>
        </div>

        <div id="mainContent" class="min-h-[500px]"></div>

        <div class="glass-card p-8 rounded-3xl">
            <h3 class="font-black text-[10px] mb-6 uppercase tracking-widest text-slate-400">Current Pain Points (Top 10 Modules)</h3>
            <div class="h-64"><canvas id="typeChart"></canvas></div>
        </div>
    </main>

    <div id="formDrawer" class="fixed top-0 right-0 h-full w-full max-w-xl bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-500 border-l">
        <div class="p-10 h-full flex flex-col">
            <div class="flex justify-between items-center mb-10">
                <h3 class="text-2xl font-black">Log Feature Request</h3>
                <button onclick="toggleForm()" class="text-slate-400 hover:text-slate-900"><i class="fas fa-times"></i></button>
            </div>
            <form id="requestForm" class="space-y-6 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Customer</label>
                        <input name="customer" required class="w-full p-4 bg-slate-50 border-2 border-slate-50 rounded-2xl text-sm outline-none focus:border-indigo-500" placeholder="Acme Inc">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">MRR ($)</label>
                        <input name="mrr" type="number" required class="w-full p-4 bg-slate-50 border-2 border-slate-50 rounded-2xl text-sm outline-none focus:border-indigo-500" placeholder="10000">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Description</label>
                    <textarea name="description" required rows="3" class="w-full p-4 bg-slate-50 border-2 border-slate-50 rounded-2xl text-sm outline-none focus:border-indigo-500" placeholder="Business need..."></textarea>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Canny URL</label>
                    <input name="canny" class="w-full p-4 bg-slate-50 border-2 border-slate-50 rounded-2xl text-sm outline-none focus:border-indigo-500" placeholder="https://canny.io/...">
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Module Category</label>
                        <select name="module" required class="w-full p-4 bg-slate-50 border-2 border-slate-50 rounded-2xl text-sm outline-none focus:border-indigo-500">
                            ${MODULE_LIST.map(m => `<option value="${m}">${m}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Priority</label>
                        <select name="priority" class="w-full p-4 bg-slate-50 border-2 border-slate-50 rounded-2xl text-sm outline-none focus:border-indigo-500">
                            <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Owner (CSM)</label>
                    <input name="owner" required class="w-full p-4 bg-slate-50 border-2 border-slate-50 rounded-2xl text-sm outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl shadow-xl hover:bg-indigo-700 transition-all">Submit Request</button>
            </form>
        </div>
    </div>

    <div id="aiModal" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-[60] p-4 backdrop-blur-md">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-in">
            <div class="p-6 bg-indigo-600 text-white flex justify-between items-center">
                <h3 class="font-black text-sm uppercase tracking-widest">✨ Strategic Analysis</h3>
                <button onclick="document.getElementById('aiModal').classList.replace('flex', 'hidden')"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-10 max-h-[70vh] overflow-y-auto custom-scrollbar" id="summaryText"></div>
            <div class="p-6 bg-slate-50 border-t text-right">
                <button onclick="document.getElementById('aiModal').classList.replace('flex', 'hidden')" class="px-8 py-3 bg-indigo-600 text-white text-xs font-black rounded-xl">Dismiss</button>
            </div>
        </div>
    </div>

</body>
</html>

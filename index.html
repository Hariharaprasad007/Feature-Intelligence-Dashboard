<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Pulse | Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .drawer-transition { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .active-tab { background: white; color: #4f46e5; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden">

    <!-- Auth & Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-xs font-black uppercase tracking-widest text-slate-400">Securing Connection...</p>
    </div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 glass-card px-8 py-4 flex items-center justify-between border-b">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                <i class="fas fa-bolt"></i>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tighter">Strategic<span class="text-indigo-600">Pulse</span></h1>
                <div id="authBadge" class="text-[8px] font-bold text-amber-500 uppercase">Connecting...</div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="bg-slate-100 p-1 rounded-xl flex gap-1 border">
                <button onclick="App.switchTab('backlog')" id="tab-backlog" class="px-4 py-2 rounded-lg text-xs font-bold transition-all active-tab">Backlog</button>
                <button onclick="App.switchTab('roadmap')" id="tab-roadmap" class="px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-500">Roadmap</button>
                <button onclick="App.switchTab('calls')" id="tab-calls" class="px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-500">Call Intelligence</button>
            </div>
            <button onclick="App.toggleDrawer(true)" class="px-6 py-2.5 bg-slate-900 text-white text-xs font-black rounded-xl hover:bg-black transition-all flex items-center gap-2">
                <i class="fas fa-plus"></i> LOG REQUEST
            </button>
        </div>
    </nav>

    <!-- Header Stats -->
    <header class="max-w-7xl mx-auto px-8 py-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-3xl border shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Total Backlog</p>
                <div id="stat-count" class="text-4xl font-extrabold">0</div>
            </div>
            <div class="bg-white p-6 rounded-3xl border shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">MRR Impact</p>
                <div id="stat-mrr" class="text-4xl font-extrabold text-indigo-600">$0</div>
            </div>
            <div class="bg-white p-6 rounded-3xl border shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Critical Needs</p>
                <div id="stat-crit" class="text-4xl font-extrabold text-red-500">0</div>
            </div>
        </div>
    </header>

    <!-- Main View -->
    <main id="viewContainer" class="max-w-7xl mx-auto px-8 pb-20"></main>

    <!-- Drawer Overlay -->
    <div id="drawerOverlay" onclick="App.toggleDrawer(false)" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity"></div>

    <!-- Log Drawer -->
    <aside id="drawer" class="fixed inset-y-0 right-0 w-full max-w-lg bg-white z-[60] shadow-2xl translate-x-full drawer-transition flex flex-col">
        <div class="p-8 border-b flex justify-between items-center">
            <h2 class="text-2xl font-black tracking-tight">Log Requirement</h2>
            <button onclick="App.toggleDrawer(false)" class="text-slate-400 hover:text-slate-900 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-8 space-y-10">
            <!-- CSV Block -->
            <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <h3 class="text-[10px] font-black text-indigo-600 uppercase mb-4 tracking-widest">Bulk Import (CSV)</h3>
                <textarea id="csvInput" rows="3" class="w-full bg-white border border-slate-200 rounded-xl p-4 text-xs outline-none mb-3" placeholder="Acme Corp, 5000, AI Writer, High, Description here..."></textarea>
                <button id="importBtn" onclick="App.handleCSV()" class="w-full py-3 bg-white border-2 border-indigo-600 text-indigo-600 font-black text-[10px] rounded-xl hover:bg-indigo-50 transition-all uppercase">Process CSV Lines</button>
            </div>

            <div class="relative"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div><div class="relative flex justify-center text-[10px] uppercase font-bold text-slate-300 bg-white px-2">Or Manual Entry</div></div>

            <!-- Form Block -->
            <form id="requestForm" class="space-y-6 pb-10">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Customer Name</label>
                        <input name="customer" required class="w-full p-4 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter Account Name">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">MRR ($)</label>
                        <input name="mrr" type="number" required class="w-full p-4 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Value">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Priority</label>
                        <select name="priority" class="w-full p-4 bg-slate-50 border rounded-xl text-sm outline-none">
                            <option>Low</option>
                            <option selected>Medium</option>
                            <option>High</option>
                            <option>Critical</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Product Module</label>
                        <select id="moduleSelect" name="module" required class="w-full p-4 bg-slate-50 border rounded-xl text-sm outline-none"></select>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Description</label>
                        <textarea name="description" rows="3" required class="w-full p-4 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Use case details..."></textarea>
                    </div>
                </div>
                <button id="saveBtn" type="submit" disabled class="w-full py-4 bg-indigo-600 text-white font-black rounded-xl shadow-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all uppercase tracking-widest text-xs">
                    Save Request
                </button>
            </form>
        </div>
    </aside>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // --- Config ---
        const config = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'feature-tracker-v1';
        const firebaseApp = initializeApp(config);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        const MODULES = [
            "AI Premium Suite", "Analytics", "API Documentation", "Article Management", "Authentication", 
            "Billing", "Bulk Operations", "Dashboard", "Editor - Advanced", "Feedback Manager", 
            "Integrations", "KB Assistant", "Notifications", "Roles & Permissions", "Search", "UI/UX"
        ].sort();

        // --- Core State Controller ---
        window.App = {
            state: {
                user: null,
                requests: [],
                tab: 'backlog',
                isDrawerOpen: false
            },

            async init() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    onAuthStateChanged(auth, (user) => {
                        this.state.user = user;
                        if (user) {
                            this.onAuthSuccess();
                            this.listen();
                        }
                    });
                } catch (e) {
                    console.error("Critical Auth Fail:", e);
                    document.getElementById('authBadge').innerText = "Auth Error - Refresh Page";
                    document.getElementById('authBadge').classList.replace('text-amber-500', 'text-red-500');
                }
            },

            onAuthSuccess() {
                document.getElementById('authBadge').innerText = "System Live";
                document.getElementById('authBadge').classList.replace('text-amber-500', 'text-emerald-500');
                document.getElementById('loadingOverlay').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('saveBtn').disabled = false;
                this.populateModules();
            },

            listen() {
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'features');
                onSnapshot(q, (snap) => {
                    this.state.requests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.render();
                }, (err) => console.error("Firestore Listen Err:", err));
            },

            populateModules() {
                const el = document.getElementById('moduleSelect');
                el.innerHTML = MODULES.map(m => `<option value="${m}">${m}</option>`).join('');
            },

            toggleDrawer(open) {
                this.state.isDrawerOpen = open;
                const drawer = document.getElementById('drawer');
                const overlay = document.getElementById('drawerOverlay');
                if (open) {
                    drawer.classList.remove('translate-x-full');
                    overlay.classList.remove('hidden');
                    setTimeout(() => overlay.classList.add('opacity-100'), 10);
                } else {
                    drawer.classList.add('translate-x-full');
                    overlay.classList.remove('opacity-100');
                    setTimeout(() => overlay.classList.add('hidden'), 400);
                }
            },

            switchTab(tab) {
                this.state.tab = tab;
                this.render();
            },

            async saveRequest(e) {
                e.preventDefault();
                if (!this.state.user) return;
                
                const btn = document.getElementById('saveBtn');
                btn.disabled = true;
                btn.innerText = "SAVING...";

                const fd = new FormData(e.target);
                const data = {
                    customer: fd.get('customer'),
                    mrr: parseInt(fd.get('mrr')) || 0,
                    module: fd.get('module'),
                    priority: fd.get('priority'),
                    description: fd.get('description'),
                    status: 'Logged',
                    createdAt: serverTimestamp(),
                    uid: this.state.user.uid
                };

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'features'), data);
                    e.target.reset();
                    this.toggleDrawer(false);
                } catch (err) {
                    console.error("Save Error:", err);
                    alert("Failed to save. Check internet connection.");
                } finally {
                    btn.disabled = false;
                    btn.innerText = "SAVE REQUEST";
                }
            },

            async handleCSV() {
                const val = document.getElementById('csvInput').value;
                const lines = val.split('\n').filter(l => l.trim().includes(','));
                if (!lines.length) return;

                const btn = document.getElementById('importBtn');
                btn.innerText = "IMPORTING...";
                btn.disabled = true;

                for (const line of lines) {
                    const [cust, mrr, mod, prio, desc] = line.split(',').map(s => s.trim());
                    if (cust) {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'features'), {
                            customer: cust,
                            mrr: parseInt(mrr) || 0,
                            module: mod || 'General',
                            priority: prio || 'Medium',
                            description: desc || 'Imported via CSV',
                            status: 'Logged',
                            createdAt: serverTimestamp(),
                            uid: this.state.user.uid
                        });
                    }
                }
                document.getElementById('csvInput').value = '';
                btn.innerText = "PROCESS CSV LINES";
                btn.disabled = false;
                this.toggleDrawer(false);
            },

            async updateStatus(id, status) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'features', id), { status });
            },

            async deleteItem(id) {
                if (confirm('Delete this request?')) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'features', id));
                }
            },

            render() {
                const container = document.getElementById('viewContainer');
                
                // Update Tabs
                ['backlog', 'roadmap', 'calls'].forEach(t => {
                    const btn = document.getElementById(`tab-${t}`);
                    if (this.state.tab === t) btn.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all active-tab";
                    else btn.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-500";
                });

                // Update Stats
                const active = this.state.requests.filter(r => r.status !== 'Shipped');
                const mrr = active.reduce((sum, r) => sum + (r.mrr || 0), 0);
                const crit = active.filter(r => r.priority === 'Critical').length;
                document.getElementById('stat-count').innerText = active.length;
                document.getElementById('stat-mrr').innerText = `$${(mrr/1000).toFixed(1)}k`;
                document.getElementById('stat-crit').innerText = crit;

                // Render Views
                if (this.state.tab === 'backlog') this.renderBacklog(container);
                else if (this.state.tab === 'roadmap') this.renderRoadmap(container);
                else this.renderCalls(container);
            },

            renderBacklog(el) {
                el.innerHTML = `
                    <div class="bg-white rounded-[2rem] border shadow-sm overflow-hidden animate-in">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50 border-b">
                                <tr>
                                    <th class="p-6 font-black uppercase text-slate-400">Account & Need</th>
                                    <th class="p-6 font-black uppercase text-slate-400">Module</th>
                                    <th class="p-6 font-black uppercase text-slate-400">Impact</th>
                                    <th class="p-6 font-black uppercase text-slate-400">Status</th>
                                    <th class="p-6 text-right"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${this.state.requests.length === 0 ? '<tr><td colspan="5" class="p-20 text-center text-slate-300">No requests found. Click "Log Request" to start.</td></tr>' : ''}
                                ${this.state.requests.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).map(r => `
                                    <tr class="hover:bg-slate-50 transition-colors">
                                        <td class="p-6">
                                            <div class="flex items-center gap-3">
                                                <div class="w-2 h-2 rounded-full ${r.priority === 'Critical' ? 'bg-red-500 animate-pulse' : r.priority === 'High' ? 'bg-orange-500' : 'bg-slate-300'}"></div>
                                                <div>
                                                    <div class="font-bold text-slate-900">${r.customer}</div>
                                                    <div class="text-[10px] text-slate-400 line-clamp-1">${r.description}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="p-6"><span class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-md font-bold text-[10px]">${r.module}</span></td>
                                        <td class="p-6 font-black text-emerald-600">$${(r.mrr || 0).toLocaleString()}</td>
                                        <td class="p-6">
                                            <select onchange="App.updateStatus('${r.id}', this.value)" class="text-[10px] font-bold text-indigo-600 bg-transparent border-none outline-none cursor-pointer">
                                                <option ${r.status === 'Logged' ? 'selected' : ''}>Logged</option>
                                                <option ${r.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                                <option ${r.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                            </select>
                                        </td>
                                        <td class="p-6 text-right">
                                            <button onclick="App.deleteItem('${r.id}')" class="text-slate-200 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            },

            renderRoadmap(el) {
                const active = this.state.requests.filter(r => r.status !== 'Shipped');
                const groups = {};
                active.forEach(r => groups[r.module] = (groups[r.module] || 0) + r.mrr);
                const sorted = Object.entries(groups).sort((a,b) => b[1] - a[1]);

                el.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${sorted.map(([name, val], i) => `
                            <div class="bg-white p-8 rounded-[2rem] border shadow-sm flex flex-col justify-between">
                                <div>
                                    <div class="text-[10px] font-black text-indigo-600 uppercase mb-4 tracking-widest">Focus Rank #${i+1}</div>
                                    <div class="text-2xl font-extrabold mb-2">${name}</div>
                                    <div class="text-3xl font-black text-emerald-600">$${(val/1000).toFixed(1)}k <span class="text-sm font-normal text-slate-400 italic">MRR Link</span></div>
                                </div>
                                <div class="mt-8 pt-6 border-t flex items-center justify-between">
                                    <div class="text-[10px] text-slate-400 font-bold uppercase">Requests: ${active.filter(r => r.module === name).length}</div>
                                    <div class="w-12 h-1 bg-indigo-500 rounded-full"></div>
                                </div>
                            </div>
                        `).join('')}
                        ${sorted.length === 0 ? '<div class="col-span-full py-20 text-center text-slate-400 italic">No revenue data available yet.</div>' : ''}
                    </div>
                `;
            },

            renderCalls(el) {
                el.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="bg-white p-10 rounded-[2.5rem] border shadow-sm">
                            <h3 class="text-2xl font-black mb-2">Sync Intelligence</h3>
                            <p class="text-xs text-slate-400 mb-8 leading-relaxed">Paste meeting transcripts or CRM notes to extract automated product insights and revenue sentiment.</p>
                            <textarea id="callInput" class="w-full h-64 p-6 bg-slate-50 border rounded-3xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="E.g. Acme corp joined the QBR and mentioned they love the analytics but really need better API documentation for their automation team..."></textarea>
                            <button onclick="App.runAI()" id="aiBtn" class="w-full mt-6 py-4 bg-slate-900 text-white font-black rounded-2xl hover:scale-[1.01] transition-all uppercase tracking-widest text-xs">Analyze Sync</button>
                        </div>
                        <div id="aiRes" class="border-4 border-dashed rounded-[2.5rem] p-10 flex flex-col items-center justify-center text-center text-slate-300">
                             <i class="fas fa-microchip text-4xl mb-4"></i>
                             <p class="text-sm font-bold uppercase tracking-wider">Awaiting Analysis...</p>
                        </div>
                    </div>
                `;
            },

            runAI() {
                const btn = document.getElementById('aiBtn');
                const out = document.getElementById('aiRes');
                btn.innerText = "DIGESTING TRANSCRIPT...";
                btn.disabled = true;

                setTimeout(() => {
                    out.innerHTML = `
                        <div class="w-full text-left bg-white p-8 rounded-3xl border shadow-sm animate-in">
                            <div class="text-[10px] font-black text-indigo-600 uppercase mb-4">AI Sentiment Report</div>
                            <div class="space-y-4">
                                <div class="p-4 bg-slate-50 rounded-xl text-xs border border-slate-100">🔥 <b>Urgency:</b> High focus on API Documentation for technical stakeholders.</div>
                                <div class="p-4 bg-slate-50 rounded-xl text-xs border border-slate-100">💰 <b>Revenue Check:</b> Customer implies expansion potential if resolved.</div>
                                <div class="p-4 bg-slate-50 rounded-xl text-xs border border-slate-100">📋 <b>Action:</b> Create Logged feature for "Developer Portal Enhancements".</div>
                            </div>
                        </div>
                    `;
                    btn.innerText = "ANALYZE SYNC";
                    btn.disabled = false;
                }, 1200);
            }
        };

        // --- Lifecycle ---
        window.addEventListener('DOMContentLoaded', () => {
            App.init();
            document.getElementById('requestForm').onsubmit = (e) => App.saveRequest(e);
        });
    </script>
</body>
</html>

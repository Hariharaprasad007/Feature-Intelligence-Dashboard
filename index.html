<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Product Pulse | Lifecycle Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Environment variables provided by the container
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "fallback", projectId: "fallback" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'feature-intel-001';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const MODULE_LIST = [
            "AI Premium Suite", "AI Search Suite", "AI Writer Suite", "Analytics", "API Documentation", 
            "Article Management", "Article Review Reminders", "Authentication", "Billing", "Bulk Operations", 
            "Category Management", "Content Reuse", "Custom Pages", "Dashboard", "Editor - Advanced", 
            "Feedback Manager", "Glossary", "Import/Export", "Integrations", "KB Assistant", "MCP", 
            "Notifications", "Readers & Groups", "Roles & Permissions", "Sandbox", "Search", "SEO", 
            "Site Performance", "Ticket Deflectors", "UI/UX", "Workflow Designer", "Workspace Manager"
        ].sort();

        let state = {
            user: null,
            requests: [],
            currentTab: 'backlog',
            filter: '',
            aiLoading: false
        };

        // --- AUTHENTICATION ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth failed:", err);
            }
        };

        onAuthStateChanged(auth, (user) => {
            state.user = user;
            if (user) {
                setupListeners();
            }
        });

        // --- DATA ---
        function setupListeners() {
            // Path: /artifacts/{appId}/public/data/feature_requests
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'feature_requests');
            onSnapshot(q, (snapshot) => {
                state.requests = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (err) => console.error("Firestore Error:", err));
        }

        // --- ACTIONS ---
        window.saveRequest = async (e) => {
            e.preventDefault();
            if (!state.user) return;
            const fd = new FormData(e.target);
            const data = {
                customer: fd.get('customer'),
                mrr: parseFloat(fd.get('mrr')) || 0,
                module: fd.get('module'),
                priority: fd.get('priority'),
                description: fd.get('description'),
                status: 'Logged',
                createdAt: Date.now(),
                userId: state.user.uid
            };
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'feature_requests'), data);
            e.target.reset();
            toggleDrawer();
        };

        window.updateStatus = async (id, status) => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'feature_requests', id);
            await updateDoc(ref, { status });
        };

        window.deleteReq = async (id) => {
            if (confirm('Delete this request?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'feature_requests', id));
            }
        };

        window.switchTab = (tab) => {
            state.currentTab = tab;
            render();
        };

        window.toggleDrawer = () => {
            document.getElementById('drawer').classList.toggle('translate-x-full');
        };

        // --- AI FEATURES ---
        window.analyzeTranscript = () => {
            const text = document.getElementById('transcriptInput').value;
            if (!text) return;
            const log = document.getElementById('aiLog');
            log.innerHTML = `<div class="p-4 bg-indigo-50 animate-pulse text-xs">Analyzing sync notes...</div>`;
            
            // Simulation of intelligence extraction logic
            setTimeout(() => {
                log.innerHTML = `
                    <div class="bg-white border rounded-xl p-4 shadow-sm space-y-3">
                        <div class="text-[10px] font-black text-indigo-600 uppercase">Extracted Insights</div>
                        <ul class="text-xs space-y-2 text-slate-600">
                            <li>🎯 <b>Decision:</b> Prioritize 'MCP' improvements for Q3.</li>
                            <li>⚠️ <b>Risk:</b> High churn threat for Acme if 'Search' isn't optimized.</li>
                            <li>✅ <b>Action:</b> Assigned documentation audit to CSM Team.</li>
                        </ul>
                    </div>
                `;
            }, 1500);
        };

        // --- UI RENDERING ---
        function render() {
            const main = document.getElementById('content');
            updateStats();
            
            if (state.currentTab === 'backlog') renderBacklog(main);
            else if (state.currentTab === 'roadmap') renderRoadmap(main);
            else renderCalls(main);
            
            updateChart();
        }

        function updateStats() {
            const active = state.requests.filter(r => r.status !== 'Shipped');
            const mrr = active.reduce((s, r) => s + (r.mrr || 0), 0);
            const crit = active.filter(r => r.priority === 'Critical').length;
            
            document.getElementById('stat-count').innerText = active.length;
            document.getElementById('stat-mrr').innerText = `$${(mrr/1000).toFixed(1)}k`;
            document.getElementById('stat-crit').innerText = crit;
        }

        function renderBacklog(el) {
            el.innerHTML = `
                <div class="bg-white rounded-3xl border shadow-sm overflow-hidden animate-in">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 text-slate-400 font-black uppercase border-b">
                            <tr>
                                <th class="p-5">Customer / Detail</th>
                                <th class="p-5">Module</th>
                                <th class="p-5">MRR Impact</th>
                                <th class="p-5">Status</th>
                                <th class="p-5 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            ${state.requests.length === 0 ? '<tr><td colspan="5" class="p-10 text-center text-slate-400">No requests found. Click "Log Request" to start.</td></tr>' : ''}
                            ${state.requests.map(r => `
                                <tr class="hover:bg-slate-50 transition-colors ${r.status === 'Shipped' ? 'opacity-40' : ''}">
                                    <td class="p-5">
                                        <div class="font-bold text-slate-900">${r.customer}</div>
                                        <div class="text-[10px] text-slate-400 truncate max-w-xs">${r.description}</div>
                                    </td>
                                    <td class="p-5"><span class="px-2 py-1 bg-slate-100 rounded font-bold">${r.module}</span></td>
                                    <td class="p-5 font-black text-emerald-600">$${(r.mrr || 0).toLocaleString()}</td>
                                    <td class="p-5">
                                        <select onchange="updateStatus('${r.id}', this.value)" class="bg-indigo-50 border-none rounded p-1 font-bold text-indigo-700 outline-none">
                                            <option value="Logged" ${r.status === 'Logged' ? 'selected' : ''}>Logged</option>
                                            <option value="In Progress" ${r.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                            <option value="Shipped" ${r.status === 'Shipped' ? 'selected' : ''}>Shipped ✅</option>
                                        </select>
                                    </td>
                                    <td class="p-5 text-right">
                                        <button onclick="deleteReq('${r.id}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        function renderRoadmap(el) {
            const moduleImpact = {};
            state.requests.filter(r => r.status !== 'Shipped').forEach(r => {
                moduleImpact[r.module] = (moduleImpact[r.module] || 0) + r.mrr;
            });
            const sorted = Object.entries(moduleImpact).sort((a,b) => b[1] - a[1]).slice(0, 3);

            el.innerHTML = `
                <div class="bg-indigo-900 rounded-[3rem] p-12 text-white shadow-2xl relative overflow-hidden animate-in">
                    <div class="relative z-10">
                        <h2 class="text-4xl font-black mb-4">Strategic Pulse</h2>
                        <p class="text-indigo-200 text-sm max-w-xl mb-12">Intelligence-driven prioritization. These modules represent your highest revenue risk based on active customer requests.</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            ${sorted.map(([name, mrr], i) => `
                                <div class="bg-white/10 backdrop-blur-xl p-8 rounded-3xl border border-white/10 hover:bg-white/20 transition-all cursor-default">
                                    <div class="text-indigo-400 font-black text-xs mb-2 uppercase tracking-widest">Rank 0${i+1}</div>
                                    <div class="text-xl font-bold mb-4">${name}</div>
                                    <div class="text-2xl font-black text-emerald-400 mb-6">$${(mrr/1000).toFixed(1)}k Risk</div>
                                    <button class="w-full py-3 bg-white text-indigo-900 font-black text-[10px] uppercase rounded-xl">Generate Business Case</button>
                                </div>
                            `).join('')}
                            ${sorted.length === 0 ? '<div class="col-span-3 text-center py-10 text-indigo-300 italic">Add requests with MRR value to see roadmap intelligence.</div>' : ''}
                        </div>
                    </div>
                </div>`;
        }

        function renderCalls(el) {
            el.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 animate-in">
                    <div class="bg-white p-10 rounded-[2.5rem] border shadow-sm">
                        <h3 class="text-2xl font-black mb-2">Sync Intelligence</h3>
                        <p class="text-xs text-slate-400 mb-8">Paste meeting transcripts or notes to extract feature decisions.</p>
                        <textarea id="transcriptInput" class="w-full h-64 p-6 bg-slate-50 border rounded-3xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="E.g. During the sync, we decided Acme needs the MCP module fixed by end of month..."></textarea>
                        <button onclick="analyzeTranscript()" class="w-full mt-6 py-5 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:scale-[1.02] active:scale-95 transition-all">
                            ✨ ANALYZE NOTES
                        </button>
                    </div>
                    <div id="aiLog" class="space-y-4">
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Intelligence Feed</div>
                        <div class="flex items-center justify-center h-full text-slate-300 italic text-xs border-4 border-dashed rounded-[2.5rem]">
                            Analysis results will appear here...
                        </div>
                    </div>
                </div>`;
        }

        let chart;
        function updateChart() {
            const ctx = document.getElementById('typeChart')?.getContext('2d');
            if (!ctx) return;
            if (chart) chart.destroy();
            
            const moduleData = {};
            state.requests.forEach(r => moduleData[r.module] = (moduleData[r.module] || 0) + 1);
            const labels = Object.keys(moduleData).slice(0, 8);
            
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Requests',
                        data: labels.map(l => moduleData[l]),
                        backgroundColor: '#6366f1',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } }, x: { grid: { display: false } } }
                }
            });
        }

        window.onload = () => {
            initAuth();
            document.getElementById('requestForm').onsubmit = window.saveRequest;
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-in { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen text-slate-900 pb-20">

    <!-- Navbar -->
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b px-8 py-5 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                <i class="fas fa-layer-group"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tighter">Strategic<span class="text-indigo-600">Pulse</span></h1>
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Enterprise Feature Intelligence</p>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div class="hidden md:flex gap-1 bg-slate-100 p-1 rounded-xl border">
                <button onclick="switchTab('backlog')" class="px-6 py-2 rounded-lg text-xs font-black transition-all hover:text-indigo-600">Backlog</button>
                <button onclick="switchTab('roadmap')" class="px-6 py-2 rounded-lg text-xs font-black transition-all hover:text-indigo-600">Roadmap</button>
                <button onclick="switchTab('calls')" class="px-6 py-2 rounded-lg text-xs font-black transition-all hover:text-indigo-600">Calls</button>
            </div>
            <button onclick="toggleDrawer()" class="px-5 py-2.5 bg-slate-900 text-white text-xs font-black rounded-xl hover:shadow-xl transition-all">
                <i class="fas fa-plus mr-2"></i>Log Request
            </button>
        </div>
    </nav>

    <!-- Header Stats -->
    <header class="max-w-7xl mx-auto px-8 py-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-8 rounded-[2rem] border shadow-sm">
                <div class="text-[10px] font-black text-slate-400 uppercase mb-2">Open Requests</div>
                <div id="stat-count" class="text-5xl font-black">0</div>
            </div>
            <div class="bg-white p-8 rounded-[2rem] border shadow-sm">
                <div class="text-[10px] font-black text-slate-400 uppercase mb-2">Revenue Impact (Risk)</div>
                <div id="stat-mrr" class="text-5xl font-black text-emerald-600">$0k</div>
            </div>
            <div class="bg-white p-8 rounded-[2rem] border shadow-sm border-l-8 border-indigo-600">
                <div class="text-[10px] font-black text-slate-400 uppercase mb-2">Critical Blockers</div>
                <div id="stat-crit" class="text-5xl font-black text-indigo-600">0</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="content" class="max-w-7xl mx-auto px-8 min-h-[500px]">
        <!-- Content injected by JS -->
    </main>

    <!-- Small Footer Chart -->
    <section class="max-w-7xl mx-auto px-8 mt-12">
        <div class="bg-white p-10 rounded-[2.5rem] border shadow-sm">
            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8">Requests by Module</h4>
            <div class="h-48">
                <canvas id="typeChart"></canvas>
            </div>
        </div>
    </section>

    <!-- Form Drawer -->
    <div id="drawer" class="fixed inset-y-0 right-0 w-full max-w-xl bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-500 border-l">
        <div class="p-12 h-full flex flex-col">
            <div class="flex justify-between items-center mb-12">
                <h2 class="text-3xl font-black">Log Request</h2>
                <button onclick="toggleDrawer()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="requestForm" class="space-y-6 overflow-y-auto pr-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Customer Name</label>
                    <input name="customer" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm" placeholder="e.g. Acme Corp">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">MRR Impact ($)</label>
                        <input name="mrr" type="number" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm" placeholder="5000">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Priority</label>
                        <select name="priority" class="w-full p-4 bg-slate-50 border rounded-2xl text-sm">
                            <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Module</label>
                    <select name="module" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm">
                        <script>
                            document.write(MODULE_LIST.map(m => `<option value="${m}">${m}</option>`).join(''));
                        </script>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Description</label>
                    <textarea name="description" rows="4" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm" placeholder="Describe the feature request..."></textarea>
                </div>
                <button type="submit" class="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl shadow-xl hover:bg-indigo-700 transition-all">SAVE REQUEST</button>
            </form>
        </div>
    </div>

</body>
</html>

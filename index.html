<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Product Pulse | Lifecycle Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "", projectId: "placeholder-id" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'feature-intel-001';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const MODULE_LIST = [
            "AI Premium Suite", "AI Search Suite", "AI Writer Suite", "Analytics", "API Documentation", 
            "Article Management", "Article Review Reminders", "Authentication", "Billing", "Bulk Operations", 
            "Category Management", "Content Reuse", "Custom Pages", "Dashboard", "Editor - Advanced", 
            "Feedback Manager", "Glossary", "Import/Export", "Integrations", "KB Assistant", "MCP", 
            "Notifications", "Readers & Groups", "Roles & Permissions", "Sandbox", "Search", "SEO", 
            "Site Performance", "Ticket Deflectors", "UI/UX", "Workflow Designer", "Workspace Manager"
        ].sort();

        let state = {
            user: null,
            requests: [],
            currentTab: 'backlog',
            isDrawerOpen: false
        };

        // --- AUTH ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("Auth Error:", err); }
        };

        onAuthStateChanged(auth, (user) => {
            state.user = user;
            if (user) setupListeners();
        });

        // --- DATA ---
        function setupListeners() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'feature_requests');
            onSnapshot(q, (snapshot) => {
                state.requests = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (err) => console.error("Firestore Error:", err));
        }

        // --- ACTIONS ---
        window.saveRequest = async (e) => {
            e.preventDefault();
            if (!state.user) return;
            const fd = new FormData(e.target);
            const data = {
                customer: fd.get('customer'),
                mrr: parseFloat(fd.get('mrr')) || 0,
                module: fd.get('module'),
                priority: fd.get('priority'),
                description: fd.get('description'),
                status: 'Logged',
                createdAt: Date.now(),
                userId: state.user.uid
            };
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'feature_requests'), data);
            e.target.reset();
            window.toggleDrawer();
        };

        window.importCSV = async () => {
            const area = document.getElementById('csvInput');
            const lines = area.value.split('\n').filter(l => l.trim().includes(','));
            if (!lines.length || !state.user) return;

            const btn = document.getElementById('csvBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                for (const line of lines) {
                    const parts = line.split(',').map(p => p.trim());
                    if (parts.length >= 3) {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'feature_requests'), {
                            customer: parts[0],
                            mrr: parseFloat(parts[1]) || 0,
                            module: parts[2],
                            priority: parts[3] || 'Medium',
                            description: parts.slice(4).join(', ') || 'Bulk Imported',
                            status: 'Logged',
                            createdAt: Date.now(),
                            userId: state.user.uid
                        });
                    }
                }
                area.value = '';
                window.toggleDrawer();
            } catch (err) {
                console.error(err);
                alert("Import encountered an error.");
            } finally {
                btn.innerText = "IMPORT CSV";
                btn.disabled = false;
            }
        };

        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'feature_requests', id), { status });
        };

        window.deleteReq = async (id) => {
            if (confirm('Permanently delete this request?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'feature_requests', id));
            }
        };

        window.switchTab = (tab) => {
            state.currentTab = tab;
            render();
        };

        window.toggleDrawer = () => {
            state.isDrawerOpen = !state.isDrawerOpen;
            const drawer = document.getElementById('drawer');
            if (state.isDrawerOpen) {
                drawer.classList.remove('translate-x-full');
                populateModuleSelect();
            } else {
                drawer.classList.add('translate-x-full');
            }
        };

        function populateModuleSelect() {
            const select = document.getElementById('moduleSelect');
            if (!select) return;
            select.innerHTML = MODULE_LIST.map(m => `<option value="${m}">${m}</option>`).join('');
        }

        // --- RENDERERS ---
        function render() {
            const main = document.getElementById('mainContent');
            updateStats();
            updateTabStyles();
            
            if (state.currentTab === 'backlog') renderBacklog(main);
            else if (state.currentTab === 'roadmap') renderRoadmap(main);
            else renderCalls(main);
            
            renderChart();
        }

        function updateStats() {
            const active = state.requests.filter(r => r.status !== 'Shipped');
            const mrr = active.reduce((sum, r) => sum + (r.mrr || 0), 0);
            const crit = active.filter(r => r.priority === 'Critical').length;
            
            document.getElementById('stat-count').innerText = active.length;
            document.getElementById('stat-mrr').innerText = `$${(mrr/1000).toFixed(1)}k`;
            document.getElementById('stat-crit').innerText = crit;
        }

        function updateTabStyles() {
            ['backlog', 'roadmap', 'calls'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (state.currentTab === t) {
                    el.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                } else {
                    el.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                }
            });
        }

        function renderBacklog(el) {
            el.innerHTML = `
                <div class="bg-white rounded-[2rem] border shadow-sm overflow-hidden animate-in">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50 text-slate-400 font-black uppercase border-b">
                                <tr>
                                    <th class="p-6">Customer & Priority</th>
                                    <th class="p-6">Module</th>
                                    <th class="p-6">Value</th>
                                    <th class="p-6">Status</th>
                                    <th class="p-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${state.requests.length === 0 ? `<tr><td colspan="5" class="p-20 text-center text-slate-400">No feature requests found. Start by clicking "Log Request".</td></tr>` : ''}
                                ${state.requests.sort((a,b) => b.createdAt - a.createdAt).map(r => `
                                    <tr class="hover:bg-slate-50 transition-colors ${r.status === 'Shipped' ? 'bg-slate-50/50 grayscale' : ''}">
                                        <td class="p-6">
                                            <div class="flex items-center gap-3">
                                                <div class="w-2 h-2 rounded-full ${r.priority === 'Critical' ? 'bg-red-500 animate-pulse' : r.priority === 'High' ? 'bg-orange-400' : 'bg-slate-300'}"></div>
                                                <div>
                                                    <div class="font-bold text-slate-900">${r.customer}</div>
                                                    <div class="text-[10px] text-slate-400 mt-0.5 line-clamp-1">${r.description}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="p-6"><span class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-md font-bold border border-indigo-100">${r.module}</span></td>
                                        <td class="p-6 font-black text-emerald-600">$${(r.mrr || 0).toLocaleString()}</td>
                                        <td class="p-6">
                                            <select onchange="updateStatus('${r.id}', this.value)" class="bg-transparent border-none font-bold text-indigo-600 outline-none cursor-pointer">
                                                <option value="Logged" ${r.status === 'Logged' ? 'selected' : ''}>Logged</option>
                                                <option value="In Progress" ${r.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                                <option value="Shipped" ${r.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                            </select>
                                        </td>
                                        <td class="p-6 text-right">
                                            <button onclick="deleteReq('${r.id}')" class="text-slate-300 hover:text-red-500 transition-colors"><i class="fas fa-trash-alt"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        function renderRoadmap(el) {
            const active = state.requests.filter(r => r.status !== 'Shipped');
            const summary = {};
            active.forEach(r => summary[r.module] = (summary[r.module] || 0) + r.mrr);
            const sorted = Object.entries(summary).sort((a,b) => b[1] - a[1]).slice(0, 4);

            el.innerHTML = `
                <div class="bg-slate-900 rounded-[3rem] p-12 text-white shadow-2xl relative overflow-hidden animate-in">
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-12">
                            <div>
                                <h2 class="text-4xl font-black mb-2">Priority Focus</h2>
                                <p class="text-slate-400 text-sm">Revenue at risk sorted by module demand.</p>
                            </div>
                            <div class="px-4 py-2 bg-emerald-500/20 text-emerald-400 rounded-full text-[10px] font-black uppercase tracking-widest border border-emerald-500/30">Live Market Pulse</div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${sorted.map(([name, val], i) => `
                                <div class="bg-white/5 border border-white/10 p-8 rounded-[2rem] hover:bg-white/10 transition-all group">
                                    <div class="text-indigo-400 text-[10px] font-black uppercase mb-4">Priority ${i+1}</div>
                                    <div class="text-xl font-bold mb-2 group-hover:text-indigo-300 transition-colors">${name}</div>
                                    <div class="text-2xl font-black text-emerald-400 mb-8">$${(val/1000).toFixed(1)}k Impact</div>
                                    <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                                        <div class="h-full bg-indigo-500" style="width: ${100 - (i*20)}%"></div>
                                    </div>
                                </div>
                            `).join('')}
                            ${sorted.length === 0 ? '<div class="col-span-4 text-center py-20 text-slate-500 italic">No revenue data available to generate roadmap.</div>' : ''}
                        </div>
                    </div>
                </div>`;
        }

        function renderCalls(el) {
            el.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in">
                    <div class="bg-white p-10 rounded-[2.5rem] border shadow-sm">
                        <h3 class="text-2xl font-black mb-2">Sync Intelligence</h3>
                        <p class="text-xs text-slate-400 mb-8">Paste meeting transcripts to extract automated product insights.</p>
                        <textarea id="aiInput" class="w-full h-64 p-6 bg-slate-50 border rounded-3xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="E.g. During the call with Acme, they mentioned that the current Dashboard is slow..."></textarea>
                        <button onclick="processAI()" class="w-full mt-6 py-5 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:scale-[1.01] active:scale-95 transition-all uppercase tracking-widest text-xs">Analyze Sync Notes</button>
                    </div>
                    <div id="aiOutput" class="flex flex-col items-center justify-center border-4 border-dashed rounded-[2.5rem] bg-slate-50/50 p-10 text-center">
                        <div class="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center text-indigo-500 mb-4">
                            <i class="fas fa-robot text-xl"></i>
                        </div>
                        <p class="text-xs font-bold text-slate-400">AI analysis results will appear here after processing.</p>
                    </div>
                </div>`;
        }

        window.processAI = () => {
            const out = document.getElementById('aiOutput');
            out.innerHTML = `<div class="animate-pulse text-indigo-600 font-black text-xs">PROBING TRANSCRIPT...</div>`;
            setTimeout(() => {
                out.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl border shadow-sm w-full text-left space-y-4 animate-in">
                        <div class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">Extracted Insights</div>
                        <div class="space-y-3">
                            <div class="p-3 bg-slate-50 rounded-xl text-xs border border-slate-100">🎯 <b>Priority:</b> Site Performance mentioned 4 times.</div>
                            <div class="p-3 bg-slate-50 rounded-xl text-xs border border-slate-100">⚠️ <b>Risk:</b> High churn probability for Acme if Editor is not updated.</div>
                            <div class="p-3 bg-slate-50 rounded-xl text-xs border border-slate-100">✅ <b>Action:</b> Schedule follow-up for Billing module feedback.</div>
                        </div>
                    </div>
                `;
            }, 1500);
        };

        let myChart;
        function renderChart() {
            const canvas = document.getElementById('activityChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (myChart) myChart.destroy();

            const active = state.requests.filter(r => r.status !== 'Shipped');
            const dataMap = {};
            active.forEach(r => dataMap[r.module] = (dataMap[r.module] || 0) + 1);
            const labels = Object.keys(dataMap).sort((a,b) => dataMap[b] - dataMap[a]).slice(0, 6);

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: labels.map(l => dataMap[l]),
                        backgroundColor: '#6366f1',
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        x: { grid: { display: false }, ticks: { stepSize: 1, color: '#94a3b8', font: { size: 10 } } },
                        y: { grid: { display: false }, ticks: { color: '#475569', font: { weight: 'bold', size: 10 } } }
                    }
                }
            });
        }

        window.onload = () => {
            initAuth();
            document.getElementById('featureForm').onsubmit = window.saveRequest;
            render();
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-in { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#fcfdfe] min-h-screen text-slate-800 pb-20">

    <!-- Header / Nav -->
    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b px-8 py-5 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white text-lg">
                <i class="fas fa-chess-knight"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tighter">Strategic<span class="text-indigo-600">Pulse</span></h1>
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Enterprise Feature Intelligence</p>
            </div>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="bg-slate-100 p-1 rounded-xl flex gap-1 border">
                <button id="tab-backlog" onclick="switchTab('backlog')" class="px-5 py-2 rounded-lg text-xs font-bold transition-all">Backlog</button>
                <button id="tab-roadmap" onclick="switchTab('roadmap')" class="px-5 py-2 rounded-lg text-xs font-bold transition-all">Roadmap</button>
                <button id="tab-calls" onclick="switchTab('calls')" class="px-5 py-2 rounded-lg text-xs font-bold transition-all">Calls</button>
            </div>
            <button onclick="toggleDrawer()" class="px-6 py-2.5 bg-indigo-600 text-white text-xs font-black rounded-xl hover:shadow-lg hover:bg-indigo-700 transition-all">
                <i class="fas fa-plus mr-2"></i>LOG REQUEST
            </button>
        </div>
    </nav>

    <!-- Stats Bar -->
    <header class="max-w-7xl mx-auto px-8 py-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-8 rounded-[2.5rem] border shadow-sm">
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Active Requests</div>
                <div id="stat-count" class="text-5xl font-black">0</div>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] border shadow-sm">
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Revenue At Risk</div>
                <div id="stat-mrr" class="text-5xl font-black text-emerald-600">$0k</div>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] border shadow-sm">
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Critical Blockers</div>
                <div id="stat-crit" class="text-5xl font-black text-red-500">0</div>
            </div>
        </div>
    </header>

    <!-- Dynamic Content -->
    <main id="mainContent" class="max-w-7xl mx-auto px-8 min-h-[400px]">
        <div class="flex items-center justify-center h-64 text-slate-300">
            <i class="fas fa-circle-notch animate-spin text-2xl"></i>
        </div>
    </main>

    <!-- Bottom Metrics -->
    <section class="max-w-7xl mx-auto px-8 mt-12">
        <div class="bg-white p-10 rounded-[3rem] border shadow-sm grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="lg:col-span-2">
                <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Request Distribution</h4>
                <div class="h-40">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>
            <div class="flex flex-col justify-center bg-slate-50 p-8 rounded-[2rem] border">
                <div class="text-[10px] font-black text-indigo-600 uppercase mb-4">Pro-Tip</div>
                <p class="text-xs text-slate-600 leading-relaxed italic">
                    Use the "Roadmap" tab to identify which modules have the highest combined MRR risk from active customers.
                </p>
            </div>
        </div>
    </section>

    <!-- Slide-out Drawer -->
    <div id="drawer" class="fixed inset-y-0 right-0 w-full max-w-xl bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-500 border-l overflow-y-auto">
        <div class="p-12">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black tracking-tighter">Entry Panel</h2>
                <button onclick="toggleDrawer()" class="w-10 h-10 hover:bg-slate-100 rounded-full flex items-center justify-center text-slate-400 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Bulk Section -->
            <div class="bg-indigo-50/50 border border-indigo-100 p-8 rounded-3xl mb-10">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-[10px] font-black text-indigo-600 uppercase">Bulk CSV Import</label>
                    <span class="text-[9px] text-indigo-400 bg-white px-2 py-0.5 rounded border">Format: Name, MRR, Module, Priority</span>
                </div>
                <textarea id="csvInput" rows="3" class="w-full bg-white border border-indigo-100 rounded-2xl p-4 text-xs outline-none focus:ring-2 focus:ring-indigo-400 transition-all mb-4" placeholder="Acme, 12000, AI Writer Suite, High"></textarea>
                <button id="csvBtn" onclick="importCSV()" class="w-full py-3 bg-indigo-600 text-white text-[10px] font-black rounded-xl hover:bg-indigo-700 transition-all">IMPORT CSV</button>
            </div>

            <div class="h-px bg-slate-100 mb-10"></div>

            <!-- Manual Form -->
            <form id="featureForm" class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Customer Name</label>
                    <input name="customer" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="e.g. Google Cloud">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">MRR Impact ($)</label>
                        <input name="mrr" type="number" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="5000">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Priority</label>
                        <select name="priority" class="w-full p-4 bg-slate-50 border rounded-2xl text-sm outline-none focus:bg-white cursor-pointer">
                            <option>Low</option>
                            <option selected>Medium</option>
                            <option>High</option>
                            <option>Critical</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Enterprise Module</label>
                    <select id="moduleSelect" name="module" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm outline-none focus:bg-white cursor-pointer">
                        <option value="">Loading modules...</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Requirement Details</label>
                    <textarea name="description" rows="4" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="What specifically are they asking for?"></textarea>
                </div>
                <button type="submit" class="w-full py-5 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:scale-[1.01] active:scale-95 transition-all uppercase tracking-widest text-xs">Save Request</button>
            </form>
        </div>
    </div>

</body>
</html>
